name: InternetSpeedReader

options:
  bundleIdPrefix: com.srimi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development: 917762034141 (XB7X3VP977)"
    DEVELOPMENT_TEAM: Z6SX8L9HA7
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  SpeedCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/SpeedCore
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        PRODUCT_NAME: SpeedCore
        SKIP_INSTALL: YES
        SWIFT_INSTALL_OBJC_HEADER: NO
        SWIFT_OBJC_INTERFACE_HEADER_NAME: ""

  InternetSpeedReader:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
    dependencies:
      - target: SpeedCore
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: InternetSpeedReader
        CFBundleDisplayName: Internet Speed Reader
        CFBundleIdentifier: com.srimi.internetspeedreader
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundlePackageType: APPL
        LSUIElement: true
        LSAppNapIsDisabled: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright 2026 Srimi. Apache-2.0."
        NSAppTransportSecurity:
          NSExceptionDomains:
            captive.apple.com:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srimi.internetspeedreader
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES

  SpeedCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SpeedCoreTests
    dependencies:
      - target: SpeedCore
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES

schemes:
  InternetSpeedReader:
    build:
      targets:
        InternetSpeedReader: all
        SpeedCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SpeedCoreTests]
    archive:
      config: Release
