name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out all history without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/security-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/security-bin" gitleaks
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"
      - name: Verify the scanner catches synthetic regressions
        run: python3 scripts/security-check-tests.py
      - name: Scan publishable files and full reachable Git history
        run: python3 scripts/security-check.py

  build:
    name: macOS build and tests
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-verified XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 120 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip \
            --output "$archive"
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $archive" | shasum -a 256 --check --status
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Build without a personal signing certificate
        run: >-
          xcodebuild -project InternetSpeedReader.xcodeproj -scheme InternetSpeedReader
          -configuration Release -derivedDataPath "$RUNNER_TEMP/ISRDerivedData"
          CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build
      - name: Run deterministic library tests
        run: >-
          xcodebuild -project InternetSpeedReader.xcodeproj -scheme InternetSpeedReader
          -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/ISRDerivedData"
          CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= test
